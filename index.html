<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>상권정보 검색</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--ink:#202b3c;--muted:#7c8798;--line:#e6e9ee;--accent:#275dce;--soft:#f7f6f2}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Arial,"Malgun Gothic",sans-serif;color:var(--ink)}
.app{height:100%;display:grid;grid-template-columns:320px minmax(0,1fr);overflow:hidden}
.sidebar{z-index:500;background:#fff;border-right:1px solid var(--line);padding:25px 18px 18px;overflow:auto}
.eyebrow{font-size:11px;letter-spacing:.16em;font-weight:800;color:#637a87;margin-bottom:10px}
h1{font-size:21px;line-height:1.45;letter-spacing:-.04em;margin:0 0 24px;font-weight:800}
.step{font-size:12px;color:#526071;margin:20px 0 9px;font-weight:700}
.drop{display:block;border:1px dashed #d7d2c7;background:#f7f5f0;border-radius:11px;padding:14px 12px;cursor:pointer;transition:.15s}
.drop.drag{border-color:var(--accent);background:#eef4ff}
.drop strong{display:block;font-size:12px;margin-bottom:5px;color:#273446}
.drop span{display:block;color:#7a817f;font-size:11px;line-height:1.55}
#csvFile{display:none}
.searchline{display:flex;gap:7px}
input[type=search]{min-width:0;flex:1;width:100%;height:38px;border:1px solid #e1ddd4;background:#f7f5f1;border-radius:9px;padding:0 11px;font-size:12px;outline:none}
input[type=search]:focus{border-color:#9bb4e9;background:white}
button{border:0;border-radius:9px;padding:0 14px;font-size:12px;font-weight:700;cursor:pointer}
button.primary{background:#c9c3b7;color:white}
button.primary.ready{background:var(--accent);color:#fff}
button:disabled{cursor:not-allowed;opacity:.65}
.message{font-size:12px;line-height:1.6;color:#77808d;min-height:28px;margin-top:15px}
.message.error{color:#b42318}
.message.good{color:#237348}
.rule{height:1px;background:var(--line);margin:20px 0 14px}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.actions button{height:33px;background:#f0f3f8;color:#32445f}
.actions button:disabled{opacity:.45}
.stats{font-size:11px;color:#8992a0;margin-top:12px;line-height:1.5}
.mapwrap{position:relative;min-width:0;min-height:0}
#map{position:absolute;inset:0;background:#d9e5e9}
.leaflet-control-zoom a{color:#263445!important}
.leaflet-popup-content{font-size:12px;line-height:1.7}
.leaflet-popup-content strong{font-size:13px}
.custom-marker{background:#275dce;border:2px solid white;border-radius:50%;width:15px;height:15px;box-shadow:0 1px 5px #1e293b66}
.map-note{position:absolute;z-index:400;right:14px;bottom:14px;background:#ffffffed;padding:8px 11px;border-radius:8px;font-size:10px;color:#697586;box-shadow:0 2px 8px #26344514;pointer-events:none}
@media(max-width:700px){.app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}.sidebar{border-right:0;border-bottom:1px solid var(--line);padding:17px 16px 13px}.eyebrow{margin-bottom:5px}h1{font-size:18px;margin-bottom:10px}.step{margin:12px 0 7px}.message{margin-top:8px;min-height:0}.rule{margin:12px 0}.mapwrap{min-height:350px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="eyebrow">상권정보 검색</div>
  <h1>상가업소 데이터에서<br>상호명으로 찾아 지도에 표시</h1>

  <div class="step">1. 소상공인시장진흥공단 상가업소 CSV 파일 선택</div>
  <label class="drop" id="dropzone" for="csvFile">
    <strong id="fileTitle">파일을 선택하거나 여기로 드래그하세요</strong>
    <span id="fileHint">상호명 / 지점명 / 도로명 / 경도 / 위도 컬럼을 포함한 CSV</span>
    <input id="csvFile" type="file" accept=".csv,text/csv">
  </label>

  <div class="step">2. 검색할 상호명 문자열 입력</div>
  <div class="searchline">
    <input id="searchInput" type="search" placeholder="예: 스타벅스" disabled>
    <button id="searchBtn" class="primary" disabled>검색</button>
  </div>
  <div id="status" class="message" role="status">CSV 파일을 먼저 선택하세요.</div>
  <div class="rule"></div>
  <div class="actions">
    <button id="resetBtn" disabled>검색 초기화</button>
    <button id="csvDownload" disabled>CSV 저장</button>
    <button id="geoDownload" disabled>GeoJSON 저장</button>
  </div>
  <div id="stats" class="stats">파일을 선택해도 지도에는 표시되지 않습니다. 상호명을 검색하면 해당 매장만 지도에 표시됩니다.</div>
</aside>
<main class="mapwrap">
  <div id="map" aria-label="상호명 검색 지도"></div>
  <div class="map-note">Leaflet · © OpenStreetMap contributors</div>
</main>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script>
(() => {
"use strict";
const $=id=>document.getElementById(id);
const REQUIRED=["상호명","지점명","도로명","경도","위도"];
let rows=[],headers=[],results=[],sourceName="상가업소",loaded=false;
const map=L.map("map",{preferCanvas:true}).setView([36.4,127.8],7);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'}).addTo(map);
const markers=L.layerGroup().addTo(map);
const status=$("status");
function msg(t,type=""){status.textContent=t;status.className="message "+type}
function headerClean(s){return String(s??"").replace(/^\\uFEFF/,"").trim()}
function normalize(r){const o={};Object.entries(r).forEach(([k,v])=>o[headerClean(k)]=v==null?"":String(v).trim());return o}
function coords(r){return [Number(String(r["위도"]).replace(/,/g,"")),Number(String(r["경도"]).replace(/,/g,""))]}
function valid(r){const [lat,lon]=coords(r);return r["위도"]!==""&&r["경도"]!==""&&Number.isFinite(lat)&&Number.isFinite(lon)&&lat>=-90&&lat<=90&&lon>=-180&&lon<=180&&!(lat===0&&lon===0)}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function popup(r){return `<strong>${esc(r["상호명"])}</strong><br>지점명: ${esc(r["지점명"]||"-")}<br>도로명: ${esc(r["도로명"]||"-")}`}
function clearMap(){markers.clearLayers();map.setView([36.4,127.8],7)}
function search(){
 const term=$("searchInput").value.trim().toLocaleLowerCase();
 if(!loaded){msg("CSV 파일을 먼저 선택하세요.");return}
 if(!term){results=[];clearMap();$("csvDownload").disabled=$("geoDownload").disabled=true;$("resetBtn").disabled=false;$("stats").textContent="검색어를 입력하면 해당 매장만 지도에 표시됩니다.";msg("검색할 상호명을 입력하세요.");return}
 results=rows.filter(r=>String(r["상호명"]||"").toLocaleLowerCase().includes(term));
 markers.clearLayers();
 const located=results.filter(valid);
 const pts=[];
 located.slice(0,5000).forEach(r=>{const p=coords(r);L.marker(p,{icon:L.divIcon({className:"",html:'<div class="custom-marker"></div>',iconSize:[15,15],iconAnchor:[7,7]})}).bindPopup(popup(r)).addTo(markers);pts.push(p)});
 if(pts.length===1)map.setView(pts[0],16);else if(pts.length>1)map.fitBounds(pts,{padding:[28,28],maxZoom:16});
 $("csvDownload").disabled=$("geoDownload").disabled=results.length===0;
 $("resetBtn").disabled=false;
 $("stats").textContent=`검색 결과 ${results.length.toLocaleString()}건 · 좌표 유효 ${located.length.toLocaleString()}건`+(results.length>5000?" · 마커는 최대 5,000개 표시":"")+(located.length<results.length?` · 좌표 오류 ${results.length-located.length}건은 지도에서 제외`:"");
 if(!results.length)msg(`'${$("searchInput").value.trim()}' 검색 결과가 없습니다.`, "");
 else msg(`'${$("searchInput").value.trim()}' 검색 결과 ${results.length.toLocaleString()}건을 찾았습니다.`, "good");
}
function load(file){
 if(!file)return;
 if(!/\.csv$/i.test(file.name)&&file.type!=="text/csv"){msg("CSV 파일을 선택해 주세요.","error");return}
 sourceName=file.name.replace(/\.csv$/i,"")||"상가업소";
 $("fileTitle").textContent=file.name;
 $("fileHint").textContent=`파일 크기 ${(file.size/1048576).toFixed(1)} MB · 브라우저에서 처리`;
 msg("파일을 읽는 중입니다...");
 Papa.parse(file,{header:true,skipEmptyLines:"greedy",worker:true,complete:r=>{
   headers=(r.meta.fields||[]).map(headerClean);
   const missing=REQUIRED.filter(k=>!headers.includes(k));
   if(missing.length){loaded=false;rows=[];$("searchInput").disabled=$("searchBtn").disabled=true;msg(`필수 컬럼이 없습니다: ${missing.join(", ")}`,"error");return}
   rows=r.data.map(normalize).filter(x=>Object.values(x).some(v=>v!==""));loaded=true;results=[];
   $("searchInput").disabled=$("searchBtn").disabled=false;$("searchInput").value="";
   $("csvDownload").disabled=$("geoDownload").disabled=true;$("resetBtn").disabled=false;
   clearMap();
   msg(`CSV 업로드 완료: ${rows.length.toLocaleString()}건. 상호명을 검색해 주세요.`,"good");
   $("stats").textContent="업로드만으로는 마커를 표시하지 않습니다. 검색 버튼을 누르면 검색 결과만 지도에 표시됩니다.";
 },error:e=>msg("파일을 읽지 못했습니다: "+e.message,"error")});
}
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$("csvFile").addEventListener("change",e=>load(e.target.files[0]));
$("searchBtn").addEventListener("click",search);
$("searchInput").addEventListener("keydown",e=>{if(e.key==="Enter")search()});
$("resetBtn").addEventListener("click",()=>{$("searchInput").value="";results=[];clearMap();$("csvDownload").disabled=$("geoDownload").disabled=true;msg("검색이 초기화되었습니다. 상호명을 입력해 주세요.");$("stats").textContent="CSV는 유지됩니다. 다시 검색할 수 있습니다."});
$("csvDownload").addEventListener("click",()=>{if(!results.length)return;const csv="\\uFEFF"+Papa.unparse({fields:headers,data:results.map(r=>headers.map(h=>r[h]??""))});download(new Blob([csv],{type:"text/csv;charset=utf-8;"}),sourceName+"_검색결과.csv")});
$("geoDownload").addEventListener("click",()=>{if(!results.length)return;const features=results.filter(valid).map(r=>{const [lat,lon]=coords(r),properties={};headers.forEach(h=>properties[h]=r[h]??"");return{type:"Feature",geometry:{type:"Point",coordinates:[lon,lat]},properties}});download(new Blob([JSON.stringify({type:"FeatureCollection",features},null,2)],{type:"application/geo+json;charset=utf-8;"}),sourceName+"_검색결과.geojson")});
const dz=$("dropzone");dz.addEventListener("dragover",e=>{e.preventDefault();dz.classList.add("drag")});dz.addEventListener("dragleave",()=>dz.classList.remove("drag"));dz.addEventListener("drop",e=>{e.preventDefault();dz.classList.remove("drag");if(e.dataTransfer.files[0])load(e.dataTransfer.files[0])});
})();
</script>
</body>
</html>
